<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#166b5f" />
    <title>혈당 로그</title>
    <link rel="manifest" href="./manifest.webmanifest?v=14" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=14" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">개인 기록용</p>
          <h1>혈당 로그</h1>
        </div>

      </header>

      <section class="daily-checklist" aria-labelledby="todaySlotChecklistTitle">
        <div class="daily-checklist-title" id="todaySlotChecklistTitle">오늘 기록 여부</div>
        <div class="slot-check-grid" id="todaySlotChecklist" aria-live="polite"></div>
      </section>

      <nav class="tabs" aria-label="화면 선택">
        <button class="tab is-active" data-tab="dashboard" type="button">대시보드</button>
        <button class="tab" data-tab="records" type="button">기록</button>
        <button class="tab" data-tab="calendar" type="button">달력</button>
        <button class="tab" data-tab="analytics" type="button">분석</button>
      </nav>

      <section class="sync-panel" aria-label="클라우드 백업">
        <div>
          <strong>클라우드 백업</strong>
          <span id="syncStatusText">로그인이 필요합니다.</span>
        </div>
        <div class="sync-actions">
          <button class="ghost-button" id="cloudSignInButton" type="button">Google 로그인</button>
          <button class="ghost-button hidden" id="cloudSyncButton" type="button">지금 동기화</button>
          <button class="text-button hidden" id="cloudSignOutButton" type="button">로그아웃</button>
        </div>
      </section>

      <main>
        <section class="tab-panel is-active" id="dashboardPanel">
          <div class="dashboard-grid">
            <form class="entry-form panel" id="readingForm">
              <div class="section-title">
                <h2 id="formTitle">혈당 기록</h2>
                <button class="ghost-button hidden" id="cancelEditButton" type="button">수정 취소</button>
              </div>

              <div class="form-row two-columns">
                <label>
                  <span>혈당</span>
                  <div class="input-with-unit">
                    <input id="valueInput" type="number" min="20" max="600" inputmode="numeric" required />
                    <span>mg/dL</span>
                  </div>
                </label>
                <label>
                  <span>측정 일시</span>
                  <input id="measuredAtInput" type="datetime-local" required />
                </label>
              </div>

              <fieldset class="segmented-field segmented-field-three">
                <legend>식사 구분</legend>
                <label>
                  <input type="radio" name="period" value="morning" checked />
                  <span>아침</span>
                </label>
                <label>
                  <input type="radio" name="period" value="lunch" />
                  <span>점심</span>
                </label>
                <label>
                  <input type="radio" name="period" value="evening" />
                  <span>저녁</span>
                </label>
              </fieldset>

              <fieldset class="segmented-field">
                <legend>측정 시점</legend>
                <label>
                  <input type="radio" name="timing" value="fasting" checked />
                  <span>공복</span>
                </label>
                <label>
                  <input type="radio" name="timing" value="postprandial2h" />
                  <span>식후 2시간 후</span>
                </label>
              </fieldset>

              <label>
                <span>식사 메모</span>
                <input id="mealNoteInput" type="text" placeholder="예: 현미밥, 계란, 김치" maxlength="80" />
              </label>

              <div class="toggle-row">
                <label class="toggle">
                  <input id="exerciseInput" type="checkbox" />
                  <span>운동함</span>
                </label>
                <label class="toggle">
                  <input id="medicationInput" type="checkbox" />
                  <span>약 복용</span>
                </label>
              </div>

              <label>
                <span>메모</span>
                <textarea id="memoInput" rows="3" placeholder="컨디션, 수면, 스트레스 등" maxlength="200"></textarea>
              </label>


              <button class="primary-button" type="submit">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 5v14" />
                  <path d="M5 12h14" />
                </svg>
                <span id="submitLabel">추가</span>
              </button>
            </form>

            <section class="panel summary-panel" aria-labelledby="todayTitle">
              <div class="section-title">
                <h2 id="todayTitle">오늘 요약</h2>
                <span class="muted" id="todayDateLabel"></span>
              </div>
              <div class="metric-grid" id="todaySummary"></div>
              <div class="alert-stack" id="patternAlerts"></div>
            </section>
          </div>

          <section class="panel">
            <div class="section-title">
              <h2>최근 기록</h2>
              <button class="text-button" data-open-tab="records" type="button">전체 보기</button>
            </div>
            <div class="record-list compact" id="recentList"></div>
          </section>
        </section>

        <section class="tab-panel" id="recordsPanel">
          <div class="section-toolbar">
            <div>
              <h2>기록</h2>
              <p class="muted" id="recordCountLabel"></p>
            </div>
            <div class="filters">
              <select id="rangeFilter" aria-label="기간 선택">
                <option value="7">최근 7일</option>
                <option value="30" selected>최근 30일</option>
                <option value="90">최근 90일</option>
                <option value="all">전체</option>
              </select>
              <select id="timingFilter" aria-label="측정 시점 필터">
                <option value="all">전체</option>
                <option value="fasting">공복</option>
                <option value="postprandial2h">식후 2시간 후</option>
              </select>
            </div>
          </div>
          <div class="record-list" id="recordList"></div>
        </section>

        <section class="tab-panel" id="calendarPanel">
          <div class="calendar-shell panel">
            <div class="section-title">
              <h2 id="calendarTitle">달력</h2>
              <div class="calendar-actions">
                <button class="icon-button" id="prevMonthButton" type="button" aria-label="이전 달" title="이전 달">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
                </button>
                <button class="icon-button" id="nextMonthButton" type="button" aria-label="다음 달" title="다음 달">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
                </button>
              </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
          <section class="panel">
            <div class="section-title">
              <h2 id="selectedDateTitle">선택한 날짜</h2>
              <span class="muted" id="selectedDateMeta"></span>
            </div>
            <div class="record-list compact" id="selectedDateList"></div>
          </section>
        </section>

        <section class="tab-panel" id="analyticsPanel">
          <div class="analytics-grid">
            <section class="panel">
              <div class="section-title">
                <h2>주간 그래프</h2>
                <span class="chart-legend"><i class="dot fasting"></i>공복 <i class="dot post"></i>식후 2시간 후</span>
              </div>
              <canvas class="chart-canvas" id="weeklyChart" height="240"></canvas>
            </section>
            <section class="panel">
              <div class="section-title">
                <h2>월간 그래프</h2>
                <span class="chart-legend"><i class="dot fasting"></i>공복 <i class="dot post"></i>식후 2시간 후</span>
              </div>
              <canvas class="chart-canvas" id="monthlyChart" height="240"></canvas>
            </section>
          </div>

          <section class="panel">
            <div class="section-title">
              <h2>인사이트</h2>
              <span class="muted" id="insightRangeLabel"></span>
            </div>
            <div class="insight-grid" id="insightGrid"></div>
          </section>
        </section>
      </main>
    </div>

    <template id="emptyTemplate">
      <div class="empty-state">
        <strong>기록이 없습니다.</strong>
        <span>첫 혈당 기록을 추가해 주세요.</span>
      </div>
    </template>

    <script src="/__/firebase/8.10.1/firebase-app.js"></script>
    <script src="/__/firebase/8.10.1/firebase-auth.js"></script>
    <script src="/__/firebase/8.10.1/firebase-firestore.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="./app.js?v=14" defer></script>
  </body>
</html>
